name: Build and deploy to Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Test backend
        run: |
          npm ci --prefix backend --no-audit --no-fund
          npm test --prefix backend
        env:
          JWT_SECRET: ci-only-secret

      - name: Test and build frontend
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm test --prefix frontend
          npm run build --prefix frontend

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve lowercase image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          owner="${repository%%/*}"
          name="${repository#*/}"
          echo "frontend=ghcr.io/${owner}/${name}-frontend" >> "$GITHUB_OUTPUT"
          echo "backend=ghcr.io/${owner}/${name}-backend" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.images.outputs.frontend }}:main
            ${{ steps.images.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.images.outputs.backend }}:main
            ${{ steps.images.outputs.backend }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Trigger Coolify deployment
        if: ${{ env.COOLIFY_WEBHOOK_URL != '' && env.COOLIFY_TOKEN != '' }}
        run: >-
          curl --fail --show-error --silent
          --request GET "$COOLIFY_WEBHOOK_URL"
          --header "Authorization: Bearer $COOLIFY_TOKEN"
